{% extends "base.html" %}

{% block content %}
<h2>Estimate Your Visa Processing Time</h2>
<form method="POST">
    <div class="form-group">
        <label for="visa_type">Visa Type</label>
        <select id="visa_type" name="visa_type" class="form-control">
            <option value="">Select</option>
            <option value="Tourist">Tourist</option>
            <option value="Student">Student</option>
            <option value="Work">Work</option>
            <option value="Business">Business</option>
        </select>
    </div>
    <div class="form-group">
        <label for="country">Applicant's Country</label>
        <select id="country" name="country" class="form-control">
            <option value="">Select</option>
            <option value="USA">🇺🇸 USA</option>
            <option value="India">🇮🇳 India</option>
            <option value="China">🇨🇳 China</option>
            <option value="UK">🇬🇧 UK</option>
            <option value="Canada">🇨🇦 Canada</option>
        </select>
    </div>
    <div class="form-group">
        <label for="urgency">Urgency Level</label>
        <select id="urgency" name="urgency" class="form-control">
            <option value="">Select</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Predict Time</button>
    <div class="progress">
        <div class="progress-bar" role="progressbar" style="width: 100%">Processing...</div>
    </div>
</form>
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else 'info' }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
{% endwith %}
{% endblock %}
